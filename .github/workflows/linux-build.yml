name: linux-build

# Compiles the translator and the runtime on a clean Linux runner. It cannot generate the
# game's C++: that needs the user's own SLUS_201.48, which is copyrighted and never uploaded.
# No game data or derived game code is built, stored or uploaded by this workflow.

on:
  push:
    branches: [steamdeck-linux-port]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 pkg-config \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libasound2-dev libpulse-dev libavcodec-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libwayland-dev libxkbcommon-dev

      - name: Configure
        run: |
          cmake -S PS2Recomp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPS2X_BUILD_RECOMP=ON -DPS2X_BUILD_RUNTIME=ON \
            -DPS2X_BUILD_ANALYZER=OFF -DPS2X_BUILD_TEST=OFF -DPS2X_BUILD_STUDIO=OFF \
            -DPS2X_ENABLE_AGRESSIVE_LOGS=OFF

      # ps2EntryRunner is deliberately not linked: its generated game code and function
      # table come from the user's own SLUS_201.48 and are absent from CI. Building the
      # runtime library still compiles every platform-specific runtime source.
      - name: Build translator and runtime library
        run: cmake --build build --target ps2_recomp ps2_runtime -j 4

      - name: Check the built binaries
        run: |
          test -x build/ps2xRecomp/ps2_recomp
          test -f build/ps2xRuntime/libps2_runtime.a
          file build/ps2xRecomp/ps2_recomp build/ps2xRuntime/libps2_runtime.a
