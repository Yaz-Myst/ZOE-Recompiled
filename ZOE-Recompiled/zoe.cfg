# Per-game config for the PS2Recomp scripts (build.ps1, work\run.ps1, regen.sh, analyze_overlays.sh, play.bat):
# plain KEY=VALUE lines, '#' comments. Required keys: NAME, ELF, DISC_DIR, CD_IMAGE, WORK_DIR, GHIDRA_PROJECT_DIR,
# GHIDRA_PROJECT, GENERATED_DIR, OVERLAYS, EXTRA_SOURCES, BUILD_DIR. Optional: STUB_REVIEW, LIB_START, SOURCE_DIR,
# GHIDRA_PRE_EXPORT_SCRIPTS. Found by the scripts via -Game zoe (games\<name>.cfg first, else <repo root>\*\<name>.cfg).
# Paths without a drive letter are relative to this folder (play.bat, games\lib.ps1 and games\lib.sh all apply that rule).

NAME=zoe
ELF=game/SLUS_201.48
DISC_DIR=game
# Your own disc image: the one machine-specific path in this file (play.bat passes it as PS2X_CD_IMAGE; a run
# started from the exe alone asks for it instead and keeps it in settings.ini).
CD_IMAGE=A:/ps2games/Zone of the Enders (U) UNDUB v1.1.iso
WORK_DIR=work
GHIDRA_PROJECT_DIR=work/ghidra_proj
GHIDRA_PROJECT=ZoneOfTheEnders
GENERATED_DIR=work/output
# Ghidra scripts (';' list, looked up in WORK_DIR/scripts) that analyze_overlays.sh runs on MAIN right before the export.
# ApplyZoeNames.java renames/creates functions from work/names/zoe_names*.csv so the exporter sees the SDK names;
# CreateMissingFunctions.java then creates functions for code Ghidra never reached (vtables, stage-code callbacks, ...).
# An entry may carry script args after a space: 'sweep' also turns unreferenced boundary-aligned code into functions
# (drop it for pointer sources only). Run tools/extract_stage_bin_ptrs.py once to (re)build work/names/zoe_stage_bin_ptrs.csv.
GHIDRA_PRE_EXPORT_SCRIPTS=ApplyZoeNames.java;CreateMissingFunctions.java sweep
# Runtime stand-ins must be reviewed: build.ps1 runs tools\check_stubs.py and FAILS if the generated code replaces any
# function with a runtime stand-in that is not in STUB_REVIEW, or one below LIB_START (game code) without a
# "game code:" reason. Automatic name matches are labels only; they must never decide what gets replaced.
# LIB_START = where the linked Sony libraries begin (sceGsResetGraph 0x467AC0 is the first; game code is below).
STUB_REVIEW=work/stubs_reviewed.csv
LIB_START=467000
# No overlays yet (add names here as they are found, e.g. OVERLAYS=NAME1;NAME2).
OVERLAYS=
# Overrides dir: every *.cpp in it is compiled into the runner (picked up on each build.ps1 configure).
EXTRA_SOURCES=src
BUILD_DIR=build
